# Local mirror of the CI `validate` job. Run it with `make lint`.
repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: https://github.com/ansible/ansible-lint
    rev: v6.22.2
    hooks:
      - id: ansible-lint
        files: ^ansible/
        # pin ansible-core to match CI; a newer core moves internals that
        # ansible-lint 6.22.2 imports and the hook crashes on import
        additional_dependencies:
          - ansible-core==2.15.13

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        # docker so nothing extra to install; same image and version as CI
        entry: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
