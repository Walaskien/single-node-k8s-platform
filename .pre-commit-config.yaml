# Local mirror of the CI `validate` job: run the same linters before pushing,
# so lint failures surface on your machine instead of in Actions.
#   pre-commit install        # wire the hooks into git commit, or
#   make lint                 # run them all on demand
repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: https://github.com/ansible/ansible-lint
    rev: v6.22.2
    hooks:
      - id: ansible-lint
        files: ^ansible/
        # pin ansible-core to match CI; a newer core moves internals that
        # ansible-lint 6.22.2 imports and the hook crashes on import
        additional_dependencies:
          - ansible-core==2.15.13
